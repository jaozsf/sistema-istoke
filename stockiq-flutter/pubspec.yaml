name: stockiq
description: ERP SaaS com estoque, financeiro e IA integrada.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP & API
  dio: ^5.4.3

  # Estado
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Firebase
  firebase_core: ^2.30.1
  firebase_auth: ^4.19.5
  firebase_messaging: ^14.9.4
  flutter_local_notifications: ^17.2.1
  google_sign_in: ^6.2.1

  # QR Code
  mobile_scanner: ^5.1.1
  qr_flutter: ^4.1.0

  # Navegação
  go_router: ^13.2.0

  # UI
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  lottie: ^3.1.0

  # Animação
  flutter_animate: ^4.5.0

  # Storage local
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # Utilitários
  intl: ^0.19.0
  uuid: ^4.4.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  logger: ^2.3.0
  connectivity_plus: ^6.0.3
  permission_handler: ^11.3.1
  path_provider: ^2.1.3
  share_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#534AB7"
  adaptive_icon_foreground: "assets/icon/app_icon_fg.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#534AB7"
    theme_color: "#534AB7"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
  # fonts: # TEMP: arquivos .ttf nao existem no repo, precisa adicionar em assets/fonts/
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
