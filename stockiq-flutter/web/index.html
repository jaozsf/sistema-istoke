<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    base href: trocado pelo valor de `flutter build web --base-href`.
    Precisa começar e terminar com "/".
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- viewport-fit=cover: no iPhone instalado na tela inicial, o app ocupa a
       área do notch/Dynamic Island (o Flutter respeita a safe area). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="StockIQ: estoque, pedidos e expedição para fábricas e distribuidoras de copos.">
  <meta name="theme-color" content="#04181C">

  <!-- iPhone/iPad: "Adicionar à Tela de Início" abre em tela cheia, como app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StockIQ">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>StockIQ</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Fundo da marca enquanto o Flutter carrega (evita flash branco no iPhone) */
    html, body { background: #04181C; margin: 0; }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
