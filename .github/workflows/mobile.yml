# Build dos apps nativos na nuvem (Android e iPhone).
#
# - Push na main mexendo no app, ou "Run workflow" manual: gera APK e IPA
#   como artefatos da execução (aba Actions).
# - Tag v* (ex: git tag v1.1.0 && git push origin v1.1.0): também anexa os
#   arquivos numa Release do GitHub.
#
# iPhone: sem conta Apple Developer o IPA sai SEM assinatura. Ele prova que o
# app compila para iOS e pode ser instalado por sideload (Sideloadly/AltStore
# com Apple ID gratuito, renovando a cada 7 dias). Para TestFlight/App Store
# é preciso a conta paga e configurar a assinatura (ver README).
name: Apps mobile

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "stockiq-flutter/**"
      - ".github/workflows/mobile.yml"
    tags: ["v*"]

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.41.4"

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stockiq-flutter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk StockIQ.apk
      - uses: actions/upload-artifact@v4
        with:
          name: StockIQ-android
          path: stockiq-flutter/StockIQ.apk
      - name: Anexar na Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: stockiq-flutter/StockIQ.apk

  ios:
    name: iPhone (IPA sem assinatura)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: stockiq-flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Empacotar IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr StockIQ-iOS-sem-assinatura.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: StockIQ-ios
          path: stockiq-flutter/StockIQ-iOS-sem-assinatura.ipa
      - name: Anexar na Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: stockiq-flutter/StockIQ-iOS-sem-assinatura.ipa
